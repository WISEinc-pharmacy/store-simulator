<style>
:root{--bg-primary:#f8f9fa;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-card-hover:#f1f5fd;--border:#dadce0;--text-primary:#202124;--text-secondary:#5f6368;--text-muted:#80868b;--accent-blue:#1a73e8;--accent-green:#1e8e3e;--accent-amber:#e37400;--accent-red:#d93025;--accent-purple:#7627bb;--accent-cyan:#007b83;--gradient-blue:linear-gradient(135deg,#1a73e8,#1557b0);--gradient-green:linear-gradient(135deg,#1e8e3e,#137333);--gradient-amber:linear-gradient(135deg,#e37400,#b06000);--gradient-red:linear-gradient(135deg,#d93025,#b3261e);--shadow:0 1px 3px rgba(60,64,67,0.15),0 1px 2px rgba(60,64,67,0.1);--shadow-lg:0 4px 12px rgba(60,64,67,0.15),0 2px 6px rgba(60,64,67,0.1);--radius:12px;--radius-sm:8px;}

/* 年合計行は.calc/.lbl/.pos/.negのtd個別指定(font-weight/background)がtr側の指定より詳細度で勝つため、
   行の区別が付きにくかった。年合計行専用にtd側でも明示的に上書きして強調する */
.dt tr.yr td,.dt tr.yr td.lbl,.dt tr.yr td.calc,.dt tr.yr td.pos,.dt tr.yr td.neg{font-weight:700;background:rgba(26,115,232,0.14)}

<script>
firebase.initializeApp({apiKey:"AIzaSyCzJVHWz8e4iyhcblnJIw-xCiCGYNC2b8I",authDomain:"wise-store-sim.firebaseapp.com",projectId:"wise-store-sim",storageBucket:"wise-store-sim.firebasestorage.app",messagingSenderId:"301306058235",appId:"1:301306058235:web:a0ac26ca035c2cf22ce75e"});
const auth=firebase.auth(),db=firebase.firestore();

// ============================================================
// 科目別単価マスタ（出典: 厚労省「調剤医療費の動向」令和6年度版 表14-3 p.18）
// https://www.mhlw.go.jp/topics/medias/year/24/dl/gaiyo_data.pdf
// ============================================================
const DEPT_MASTER={
  '内科':       {techFee:2824, drugCost:5615},
  '心療内科':   {techFee:2824, drugCost:5615},
  '小児科':     {techFee:2358, drugCost:2032},
  '外科':       {techFee:2712, drugCost:4886},
  '整形外科':   {techFee:2198, drugCost:3018},
  '皮膚科':     {techFee:2191, drugCost:3584},
  '産婦人科':   {techFee:2238, drugCost:4972},
  '眼科':       {techFee:1642, drugCost:2077},
  '耳鼻咽喉科': {techFee:2307, drugCost:2214},
  '精神科':     {techFee:2789, drugCost:5227},
};
const DEPT_NAMES=Object.keys(DEPT_MASTER);

function calcDeptMix(deptMix){
  let tech=0,drug=0,totalRatio=0;
  (deptMix||[]).forEach(d=>{
    const m=DEPT_MASTER[d.dept];if(!m)return;
    tech+=m.techFee*(d.ratio/100);
    drug+=m.drugCost*(d.ratio/100);
    totalRatio+=d.ratio;
  });
  return {techFeePerRx:Math.round(tech),drugCostPerRx:Math.round(drug),totalRatio};
}

// ============================================================
// Master unit price defaults
// ============================================================
const DEFAULT_MASTER={

  cols.push({key:'revenue',label:'⑪売上高',type:'calc',formula:'⑥+⑦+⑧+⑨+⑩'});
  cols.push({key:'cogs',label:'⑫仕入原価',type:'calc',formula:'(⑨+⑩)×(1-差益率)'});
  cols.push({key:'grossProfit',label:'⑬売上総利益',type:'calc',formula:'⑪-⑫'});
  cols.push({key:'staffCost',label:'⑭人件費',type:'calc',formula:'Σ(③×月給)'});

  return cols;

// Calculate a row from master + scenario settings + staffTypes + monthly inputs
function calcRow(r, master, settings, staffTypes){
  if(!master||!settings) return r;
  const m=master, s=settings, st=staffTypes||[];
  const depts=(m.deptMix||[]).map(d=>d.dept);

  // 外来枚数 × 加重平均単価（科目構成から計算済み）
  r.rxTotal=r.rxCount||0;
  const mix=calcDeptMix(m.deptMix);
  if(mix.totalRatio===100){
    r.techOutpatient=r.rxTotal*mix.techFeePerRx;
    r.drugOutpatient=r.rxTotal*mix.drugCostPerRx;
  }else{
    r.techOutpatient=r.rxTotal*m.techFeePerRx;
    r.drugOutpatient=r.rxTotal*m.drugCostPerRx;
  }
  // 集中率は科目構成の最大比率
  const maxRatio=Math.max(...(m.deptMix||[]).map(d=>d.ratio||0),0);
  r.concentrationRate=(m.deptMix||[]).length>0?maxRatio:100;

  // 在宅
  r.techHomecare=(r.homecareCount||0)*m.techFeePerHC;
  r.drugHomecare=(r.homecareCount||0)*m.drugCostPerHC;

  // 地域支援加算（月次入力の単価 × 外来枚数合計）
  const regPerRx=r.regionalPerRx||0;
  r.regionalSupport=regPerRx*r.rxTotal;

  // 売上
  r.revenue=r.techOutpatient+r.regionalSupport+r.techHomecare+r.drugOutpatient+r.drugHomecare;

  // 仕入原価（薬価差益率ベース）
  const drugRevenue=r.drugOutpatient+r.drugHomecare;
  const marginRate=m.drugMarginRate!=null?m.drugMarginRate:s.drugMarginRate!=null?s.drugMarginRate:0.05;
  r.cogs=Math.round(drugRevenue*(1-marginRate));
  r.grossProfit=r.revenue-r.cogs;

  // 人件費（月次入力の人数 × マスタ月給）
  r.staffCost=0;
  (st||[]).forEach((t,i)=>{
    const cnt=r['staff_'+i]||0;
    r.staffCost+=t.monthlySalary*cnt;
  });

  // 経費
  r.rent=m.rent!=null?m.rent:s.rent;
  const techTotal=r.techOutpatient+r.techHomecare;
  r.otherCost=Math.round(techTotal*(m.otherCostRatio!=null?m.otherCostRatio:s.otherCostRatio||0.08));

  // 減価償却費（設備投資合計 ÷ 償却月数・定額法）。投資は店舗全体で共通のため storeData.investment を参照。
  {
    const _inv=(typeof storeData!=='undefined'&&storeData)?storeData.investment:null;
    const _depMonths=(_inv&&_inv.depreciationMonths)?_inv.depreciationMonths:60;
    const _equipTotal=(_inv&&Array.isArray(_inv.equipment))?_inv.equipment.reduce((a,e)=>a+(e.value||0),0):0;
    r.depreciation=Math.round(_equipTotal/_depMonths);
  }

  // 営業利益
  r.operatingProfit=r.grossProfit-r.staffCost-r.rent-r.otherCost-r.depreciation;

  return r;
}

function recalcScenario(sc, master, staffTypes){
  sc.months.forEach(r=>calcRow(r, master, sc.settings, staffTypes));
}

const YUYAMA_ONEDY_QUOTE_ITEM={label:'\u96fb\u5b50\u5929\u79e4\u30fb\u6563\u5264\u9451\u67fb\u30b7\u30b9\u30c6\u30e0',value:660000,detail:'\u30e6\u30e4\u30de LIBRA-320D II + OnedyEX2 \u7a0e\u8fbc',pdfUrl:'https://drive.google.com/file/d/1MVadWYszKpwxpbGz-4nFnxkevdCs4Smz/view'};
function ensureKoshigayaYuyamaQuote(store){
  if(!store||!store.investment||!Array.isArray(store.investment.equipment))return;
  const name=String(store.name||'');
  if(!name.includes('\u8d8a\u8c37')&&!name.includes('\u5357\u8d8a\u8c37'))return;
  const eq=store.investment.equipment;
  const item={...YUYAMA_ONEDY_QUOTE_ITEM};
  const idx=eq.findIndex(e=>e.label===item.label||String(e.pdfUrl||'').includes('1MVadWYszKpwxpbGz-4nFnxkevdCs4Smz'));
  if(idx>=0){eq[idx]={...eq[idx],...item};return;}
  const baseIdx=eq.findIndex(e=>e.label==='\u5206\u5305\u6a5f\u985e');
  eq.splice(baseIdx>=0?baseIdx+1:eq.length,0,item);
}

async function loadStore(id){
  const doc=await db.collection('store_simulations').doc(id).get();
  if(!doc.exists)return;
  storeData={id,...doc.data()};
  // Ensure master & staffTypes exist (migration)
  if(!storeData.master) storeData.master={...DEFAULT_MASTER};
  if(!storeData.staffTypes) storeData.staffTypes=JSON.parse(JSON.stringify(DEFAULT_STAFF_TYPES));
  if(!storeData.master.deptMix) storeData.master.deptMix=[];
  if(!storeData.property) storeData.property={};
  ensureConfirmedStaff(storeData);
  // 初期投資: 旧ラベルのリネームのみ行う（テンプレート自動追加はaddStoreで実施済み）
  if(storeData.investment){
    // 紹介手数料が運転資金にあれば設備に移動（旧データ互換）
    const wi=storeData.investment.working||[];
    const refIdx=wi.findIndex(e=>e.label==='紹介手数料');
    if(refIdx>=0){
      const refItem=wi.splice(refIdx,1)[0];
      if(!storeData.investment.equipment.find(e=>e.label==='紹介手数料')){
        storeData.investment.equipment.push(refItem);
      }
    }
    ['equipment','working'].forEach(cat=>{
      const existing=storeData.investment[cat]||[];
      existing.forEach(e=>{if(e.label==='内装費（またはのれん代）')e.label='内装費';});
      storeData.investment[cat]=existing;
    });
    ensureKoshigayaYuyamaQuote(storeData);
    // 減価償却期間: 旧既定120（P/L未配線で死んでいたフィールドの名残）を一度だけ60ヶ月（5年）へ正規化する。
    // depMonthsMigrated フラグ以後はユーザー設定を尊重（再正規化しない）。次回保存時にDBへ書き戻され自己修復する。
    if(!storeData.investment.depMonthsMigrated){
      storeData.investment.depreciationMonths=60;
      storeData.investment.depMonthsMigrated=true;
    }
  }
  storeData.scenarios.forEach(sc=>{
    if(!sc.settings) sc.settings={...DEFAULT_SC_SETTINGS};
    recalcScenario(sc, storeData.master, storeData.staffTypes);
  });
  // activeTabを維持。該当シナリオタブが無い場合のみoverviewに戻す
  if(activeTab.startsWith('sc')){const idx=parseInt(activeTab.slice(2));if(idx>=storeData.scenarios.length)activeTab='overview';}
  renderTabs();renderContent();
}

  if(canEdit)h+=`<button class="tab-add" onclick="addScenario()">+ シナリオ</button>`;
  h+=`<button class="tab-btn ${activeTab==='equipment'?'active':''}" onclick="switchTab('equipment')" style="margin-left:auto">🔧 備品・機材</button>`;
  h+=`<button class="tab-btn ${activeTab==='settings'?'active':''}" onclick="switchTab('settings')">基本情報</button>`;
  bar.innerHTML=h;
}
function switchTab(t){activeTab=t;renderTabs();renderContent();}
function renderContent(){
  if(!storeData)return;const el=document.getElementById('main-content');
  el.style.background=activeTab==='overview'?'rgba(16,185,129,0.03)':'';
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};
  if(activeTab==='overview')renderOverview(el);
  else if(activeTab.startsWith('sc'))renderScenario(el,+activeTab.slice(2));
  else if(activeTab==='compare')renderCompare(el);
  else if(activeTab==='equipment')renderEquipment(el);
  else if(activeTab==='settings')renderSettings(el);
}

// ============================================================
// Helpers
// ============================================================
function fmt(n){return n==null?'':Math.round(n).toLocaleString('ja-JP')}
function fmtInput(v){const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?'':fmt(n)}
function unfmtInput(v){return String(v).replace(/,/g,'')}
function moneyFocus(el){el.value=unfmtInput(el.value)}
function moneyBlur(el){el.value=fmtInput(el.value)}
function fmtMY(n){if(n==null)return'-';return(n<0?'-':'')+Math.abs(Math.round(n/10000)).toLocaleString()+'万円'}
function fmtOku(n){if(n==null)return'-';if(Math.abs(n)>=1e8)return(n/1e8).toFixed(2)+'億円';return fmtMY(n)}
function getTotalInv(){const i=storeData.investment;return i.equipment.reduce((s,e)=>s+e.value,0)+i.working.reduce((s,e)=>s+e.value,0)}
function getAnnual(ms){const y=[];for(let i=1;i<=4;i++){const m=ms.filter(r=>r.year===i);y.push({year:i,revenue:m.reduce((s,r)=>s+r.revenue,0),grossProfit:m.reduce((s,r)=>s+r.grossProfit,0),operatingProfit:m.reduce((s,r)=>s+r.operatingProfit,0)});}return y;}
function getPayback(ms,inv){let c=-inv;for(let i=0;i<ms.length;i++){c+=ms[i].operatingProfit;if(c>=0)return i+1;}return null;}
function chartOpts(){return{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{labels:{color:'#5f6368',usePointStyle:true,pointStyleWidth:8}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtMY(c.raw)}}},scales:{x:{ticks:{color:'#5f6368',maxTicksLimit:12},grid:{color:'rgba(218,220,224,0.5)'}},y:{ticks:{color:'#5f6368',callback:v=>fmtMY(v)},grid:{color:'rgba(218,220,224,0.5)'}}}}}
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'];
function htmlEsc(v){return String(v??'').replace(/[&<>\"']/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='\"'?'&quot;':'&#39;');}
function renderConfirmedStaffSection(){

  h+='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;min-width:850px"><tr style="color:var(--text-muted)"><th style="text-align:left">\u6c0f\u540d</th><th>\u914d\u7f6e</th><th>\u5f79\u5272</th><th>\u30b9\u30c6\u30fc\u30bf\u30b9</th><th>\u5165\u793e\u4e88\u5b9a</th><th style="text-align:left">\u5099\u8003</th></tr>';

// 期間フィルター
function applyPeriodFilter(idx){
  const from=parseInt(document.getElementById('filter-from-'+idx).value)||1;
  const to=parseInt(document.getElementById('filter-to-'+idx).value)||48;
  const sc=storeData.scenarios[idx];if(!sc)return;
  // テーブルの行を表示/非表示
  document.querySelectorAll('#dtc tr[data-yr]').forEach(tr=>{
    const cells=tr.querySelectorAll('td');
    const month=parseInt(cells[0]?.textContent);
    if(!isNaN(month))tr.style.display=(month>=from&&month<=to)?'':'none';
  });
  // 期間サマリーを計算
  const filtered=sc.months.filter(m=>m.month>=from&&m.month<=to);
  if(filtered.length>0){
    const rev=filtered.reduce((s,m)=>s+(m.revenue||0),0);
    const op=filtered.reduce((s,m)=>s+(m.operatingProfit||0),0);
    const staff=filtered.reduce((s,m)=>s+(m.staffCost||0),0);
    const el=document.getElementById('period-summary-'+idx);
    el.innerHTML=`${from}〜${to}月: 売上${fmtMY(rev)} / 営業利益<span style="color:${op>=0?'var(--accent-green)':'var(--accent-red)'}"> ${fmtMY(op)}</span> / 人件費${fmtMY(staff)} (${filtered.length}ヶ月間)`;
  }
}
function resetPeriodFilter(idx){
  document.getElementById('filter-from-'+idx).value=1;
  document.getElementById('filter-to-'+idx).value=48;
  document.querySelectorAll('#dtc tr[data-yr]').forEach(tr=>tr.style.display='');
  const el=document.getElementById('period-summary-'+idx);if(el)el.innerHTML='';
}

async function runAnalysis(idx){
  const sc=storeData.scenarios[idx];if(!sc)return;
  // ローディング表示
  const btn=document.getElementById('analysis-btn-'+idx);
  const textEl=document.getElementById('analysis-text-'+idx);
  if(btn){btn.disabled=true;btn.textContent='分析中...';btn.style.animation='pulse 1s ease-in-out infinite';}
  if(textEl){textEl.style.opacity='0.4';textEl.style.transition='opacity 0.3s';}
  const s=sc.settings,st=storeData.staffTypes||[];
  const m=storeData.master;
  const ti=getTotalInv(),an=getAnnual(sc.months),pb=getPayback(sc.months,ti);
  const cum=sc.months.reduce((a,m)=>a+m.operatingProfit,0);
  const m0=sc.months[0],m48=sc.months[47]||m0;
  const rx0=m0.rxTotal||m0.rxCount||0, rx48=m48.rxTotal||m48.rxCount||0;
  const hc48=m48.homecareCount||0;
  const marginRate=m.drugMarginRate!=null?m.drugMarginRate:s.drugMarginRate!=null?s.drugMarginRate:0.05;

  // 科目別枚数（1ヶ月目）
  const depts=(m.deptMix||[]).map(d=>d.dept);
  let deptInfo='';
  if(depts.length>0){
    deptInfo=depts.map(d=>{const cnt=m0['rx_'+d]||0;const dm=DEPT_MASTER[d];return d+' '+fmt(cnt)+'枚(技'+fmt(dm?dm.techFee:0)+'円)';}).join(' / ');
  }

  // 人件費（1ヶ月目）
  let staffInfo='',staffCost0=0;
  (st||[]).forEach((t,i)=>{const cnt=m0['staff_'+i]||0;if(cnt>0){staffInfo+=(staffInfo?', ':'')+t.name+'x'+cnt;staffCost0+=t.monthlySalary*cnt;}});

  // 単月黒字化月
  let breakMonth=null;
  for(let i=0;i<sc.months.length;i++){if(sc.months[i].operatingProfit>0){breakMonth=i+1;break;}}

  // 売上に占める人件費率（4年目）
  const y4rev=an[3].revenue;
  const m48staff=m48.staffCost||0;
  const staffRatio=y4rev>0?((m48staff*12/y4rev)*100).toFixed(1):'--';

  // 地域支援加算（1ヶ月目の単価）
  const regPerRx=m0.regionalPerRx||0;
  const regional=regPerRx>0?fmt(regPerRx)+'円/枚':'なし';

  // コンプライアンスチェック（薬剤師1人40枚/日）
  const opDays=m.operatingDays||25;
  let complianceWarnings=[];
  sc.months.forEach(row=>{
    const rx=row.rxTotal||row.rxCount||0;
    if(rx===0)return;
    const dailyRx=Math.ceil(rx/opDays);
    // 薬剤師数を合計（staffTypesから薬剤師系を判定）
    let pharmacistCount=0;
    (st||[]).forEach((t,i)=>{
      if(t.name.includes('薬剤師')||t.name.includes('マネージャー'))pharmacistCount+=(row['staff_'+i]||0);
    });
    const requiredPharmacists=Math.ceil(dailyRx/40);
    if(pharmacistCount>0&&pharmacistCount<requiredPharmacists){
      complianceWarnings.push({month:row.month,dailyRx,pharmacistCount,required:requiredPharmacists,perPharmacist:Math.ceil(dailyRx/pharmacistCount)});
    }
  });

  // リスク判定
  let risks=[];
  if(!breakMonth)risks.push('4年間で単月黒字に到達しない');
  else if(breakMonth>24)risks.push('単月黒字化まで'+breakMonth+'ヶ月と長い');
  if(!pb)risks.push('4年以内に投資回収できない');
  if(marginRate<0.03)risks.push('薬価差益率が'+(marginRate*100).toFixed(1)+'%と低い');
  if(staffRatio!=='--'&&parseFloat(staffRatio)>50)risks.push('売上に対する人件費率が'+staffRatio+'%と高い');
  if(rx0===0)risks.push('処方箋枚数が未入力（0枚）');
  if(staffCost0===0)risks.push('スタッフ人数が未入力');
  if(complianceWarnings.length>0)risks.push('薬剤師1人あたり40枚/日超過の月あり（'+complianceWarnings.length+'ヶ月）');

  // 強み判定
  let strengths=[];
  if(breakMonth&&breakMonth<=6)strengths.push('開業'+breakMonth+'ヶ月目で早期黒字化');
  if(pb&&pb<=24)strengths.push('投資回収が'+Math.ceil(pb/12*10)/10+'年と早い');
  if(regPerRx>0)strengths.push('地域支援体制加算あり（'+fmt(regPerRx)+'円/枚）');
  if(cum>0)strengths.push('4年累計利益 '+fmtOku(cum)+' (ROI '+(ti>0?(cum/ti*100).toFixed(0):0)+'%)');

  let txt='<div style="font-weight:700;color:var(--accent-purple);margin-bottom:12px;font-size:1.8rem">シナリオ分析: '+sc.name+'</div>';
  txt+='<div style="margin-bottom:6px"><b>前提:</b> 外来'+fmt(rx0)+'枚/月';
  if(rx48!==rx0)txt+=' → '+fmt(rx48)+'枚/月（48ヶ月目）';
  if(hc48>0)txt+=' / 在宅'+hc48+'件/月';
  txt+=' / 薬価差益率'+(marginRate*100).toFixed(1)+'% / 家賃'+fmt(m.rent!=null?m.rent:s.rent)+'円</div>';
  txt+='<div style="margin-bottom:6px"><b>営業:</b> 月'+opDays+'日 / '+weeklyHoursSummary(m)+'</div>';
  txt+='<div style="margin-bottom:6px"><b>人員(1ヶ月目):</b> '+(staffInfo||'未設定')+' = '+fmt(staffCost0)+'円/月</div>';
  txt+='<div style="margin-bottom:6px"><b>地域支援加算:</b> '+regional+'</div>';
  // コンプライアンスチェック（1ヶ月目）
  const dailyRx0=rx0>0?Math.ceil(rx0/opDays):0;
  let phCount0=0;(st||[]).forEach((t,i)=>{if(t.name.includes('薬剤師')||t.name.includes('マネージャー'))phCount0+=(m0['staff_'+i]||0);});
  const reqPh0=dailyRx0>0?Math.ceil(dailyRx0/40):0;
  const perPh0=phCount0>0?Math.ceil(dailyRx0/phCount0):0;
  txt+='<div style="margin-bottom:6px"><b>1日あたり処方箋:</b> '+dailyRx0+'枚/日';
  if(phCount0>0)txt+='（薬剤師1名あたり'+perPh0+'枚 '+(perPh0>40?'<span style="color:var(--accent-red)">→ 上限40枚超過</span>':'<span style="color:var(--accent-green)">→ 基準内</span>')+'）';
  txt+='</div>';
  txt+='<div style="margin-bottom:6px"><b>必要薬剤師数:</b> '+reqPh0+'名（現在'+phCount0+'名'+(phCount0<reqPh0?' <span style="color:var(--accent-red)">→ '+( reqPh0-phCount0)+'名不足</span>':' <span style="color:var(--accent-green)">→ 充足</span>')+'）</div>';
  txt+='<div style="margin-bottom:6px"><b>単月黒字化:</b> '+(breakMonth?breakMonth+'ヶ月目':'4年間で未達')+'</div>';
  txt+='<div style="margin-bottom:6px"><b>投資回収:</b> '+(pb?Math.ceil(pb/12*10)/10+'年（'+pb+'ヶ月）':'4年以内に未達')+'</div>';
  if(strengths.length)txt+='<div style="margin-bottom:6px;color:var(--accent-green)"><b>強み:</b> '+strengths.join(' / ')+'</div>';
  if(risks.length)txt+='<div style="margin-bottom:6px;color:var(--accent-red)"><b>リスク:</b> '+risks.join(' / ')+'</div>';
  if(complianceWarnings.length>0){
    txt+='<div style="margin-top:8px;padding:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:var(--accent-red)">';
    txt+='<b>⚠ コンプライアンス警告（薬剤師1人40枚/日上限）:</b><br>';
    const first3=complianceWarnings.slice(0,3);
    first3.forEach(w=>txt+=w.month+'ヶ月目: '+w.dailyRx+'枚/日 ÷ '+w.pharmacistCount+'名 = '+w.perPharmacist+'枚/人（必要'+w.required+'名）<br>');
    if(complianceWarnings.length>3)txt+='...他'+(complianceWarnings.length-3)+'ヶ月';
    txt+='</div>';
  }

  analysisCache[idx]=txt;
  storeData.scenarios[idx].analysisHtml=txt;
  document.getElementById('analysis-text-'+idx).innerHTML=txt;
  // ローディング解除
  const btn2=document.getElementById('analysis-btn-'+idx);
  const textEl2=document.getElementById('analysis-text-'+idx);
  if(btn2){btn2.disabled=false;btn2.textContent='再分析';btn2.style.opacity='1';btn2.style.animation='';}
  if(textEl2){textEl2.style.opacity='1';}
  await saveStoreImmediate();
}

function renderDataTable(sc,scIdx){
  const wrap=document.getElementById('dtc');
  const cols=buildCols(storeData.master,storeData.staffTypes);
  let h='<table class="dt"><thead><tr>';
  cols.forEach(c=>{
    const isInput=c.type==='input'||c.type==='input-text';
    const formulaSub=c.formula?`<br><span style="font-size:0.65rem;font-weight:400;color:var(--text-muted)">${c.formula}</span>`:'';
    h+=`<th class="${isInput?'input-hdr':''}">${c.label}${formulaSub}</th>`;
  });
  h+='</tr></thead><tbody>';
  let prev=0;
  sc.months.forEach((row,ri)=>{
    if(row.year!==prev&&prev>0)h+=yrRow(sc.months,prev,cols);
    prev=row.year;
    const hidden=collapsedYears[row.year]?'style="display:none"':'';
    h+=`<tr data-yr="${row.year}" ${hidden}>`;
    cols.forEach(col=>{
      const v=row[col.key];
      if(col.type==='fixed')h+=`<td class="lbl">${col.key==='year'?v+'年目':v}</td>`;
      else if(col.type==='calc'){
        const isPL=col.key==='operatingProfit';
        const cls=isPL?(v>=0?'pos':'neg'):'calc';
        h+=`<td class="${cls}">${col.suffix==='%'?(v||0).toFixed(1)+'%':fmt(v)}</td>`;
      }
      else if(col.type==='input'&&canEdit)h+=`<td class="input-cell"><input type="number" value="${v||0}" data-k="${col.key}" data-s="${scIdx}" data-r="${ri}" onchange="onRowEdit(this)"></td>`;
      else if(col.type==='input-text'&&canEdit)h+=`<td class="input-cell"><input type="text" value="${v||''}" data-k="${col.key}" data-s="${scIdx}" data-r="${ri}" onchange="onRowEdit(this)"></td>`;
      else h+=`<td>${col.type==='input-text'?(v||''):fmt(v||0)}</td>`;
    });
    h+='</tr>';
    // 各年の1ヶ月目（先頭月）の行の直下にコピー行を挿入（canEdit のときのみ）
    if(canEdit&&ri%12===0){
      const yi=Math.floor(ri/12);
      const yrHidden=collapsedYears[row.year]?'style="display:none"':'';
      h+=`<tr class="copy-row" data-yr="${row.year}" ${yrHidden}><td colspan="${cols.length}" style="text-align:center;padding:4px 2px;background:rgba(37,99,235,0.05);border-top:1px dashed var(--accent-blue);border-bottom:1px dashed var(--accent-blue)"><button onclick="copyYear(${scIdx},${yi})" style="padding:5px 16px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.78rem;cursor:pointer;font-family:inherit;font-weight:600;transition:all 0.2s" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform=''">残り12か月同じ数字をコピーする</button></td></tr>`;
    }
  });
  h+=yrRow(sc.months,4,cols)+'</tbody></table>';
  wrap.innerHTML=h;
}

function toggleYear(yr){
  collapsedYears[yr]=!collapsedYears[yr];
  document.querySelectorAll(`tr[data-yr="${yr}"]`).forEach(r=>r.style.display=collapsedYears[yr]?'none':'');
  const icon=document.getElementById('yr-icon-'+yr);
  if(icon)icon.textContent=collapsedYears[yr]?'\u25B6':'\u25BC';
}
function yrRow(ms,yr,cols){
  const ym=ms.filter(m=>m.year===yr);if(!ym.length)return'';
  const icon=collapsedYears[yr]?'\u25B6':'\u25BC';
  const fixedCount=cols.filter(c=>c.type==='fixed').length;
  let h=`<tr class="yr" style="cursor:pointer" onclick="toggleYear(${yr})"><td class="lbl" colspan="${fixedCount}"><span id="yr-icon-${yr}" style="font-size:0.7rem;margin-right:4px">${icon}</span>${yr}年目 合計</td>`;
  cols.forEach(col=>{
    if(col.type==='fixed')return;
    if(col.type==='input-text'){h+='<td></td>';return;}
    if(col.type==='input'){
      // 入力列は平均値表示
      const avg=ym.reduce((s,m)=>s+(m[col.key]||0),0)/ym.length;
      h+=`<td class="lbl">${avg%1===0?fmt(avg):avg.toFixed(1)}</td>`;
      return;
    }
    // calc列は合計（集中率は平均）
    if(col.suffix==='%'){
      const avg=ym.reduce((s,m)=>s+(m[col.key]||0),0)/ym.length;
      h+=`<td class="calc">${avg.toFixed(1)}%</td>`;
    }else{
      const t=ym.reduce((s,m)=>s+(m[col.key]||0),0);
      const cls=col.key==='operatingProfit'?(t>=0?'pos':'neg'):'calc';
      h+=`<td class="${cls}">${fmt(t)}</td>`;
    }
  });
  h+='</tr>';return h;
}

function onRowEdit(el){
  const key=el.dataset.k,si=+el.dataset.s,ri=+el.dataset.r;
  const cols=buildCols(storeData.master,storeData.staffTypes);
  const col=cols.find(c=>c.key===key);
  storeData.scenarios[si].months[ri][key]=col&&col.type==='input-text'?el.value:(parseFloat(el.value)||0);
  calcRow(storeData.scenarios[si].months[ri],storeData.master,storeData.scenarios[si].settings,storeData.staffTypes);
  // Re-render table to update year totals, then restore focus
  const focusKey=key, focusRi=ri;
  renderDataTable(storeData.scenarios[si],si);
  // Restore focus to same cell
  const inp=document.querySelector(`#dtc input[data-k="${focusKey}"][data-r="${focusRi}"]`);
  if(inp){inp.focus();inp.select&&inp.select();}
  saveStoreDebounced();
}

// 各年の先頭月手入力セルを年内の残り月へ一括コピー（yearIdx=0始まり）
function copyYear(scIdx,yearIdx){
  if(!canEdit||!storeData)return;
  const sc=storeData.scenarios[scIdx];
  if(!sc)return;
  const cols=buildCols(storeData.master,storeData.staffTypes);
  // input-text（備考）は各月固有なので除外、calc・fixed・集中率(suffix='%')も除外
  const inputCols=cols.filter(c=>c.type==='input');
  if(!inputCols.length){alert('入力列が見つかりません。');return;}
  const firstIdx=yearIdx*12;
  if(firstIdx>=sc.months.length){alert('該当する年のデータがありません。');return;}
  const m1=sc.months[firstIdx];
  const allEmpty=inputCols.every(c=>{const v=m1[c.key];return v===undefined||v===null||v===0||v===''});
  if(allEmpty){alert((yearIdx+1)+'年目の1ヶ月目を先に入力してください。');return;}
  const yn=yearIdx+1;
  if(!confirm(yn+'年目の1ヶ月目の入力値を年内の残り月に上書きします。よろしいですか？'))return;
  for(let ri=firstIdx+1;ri<=firstIdx+11&&ri<sc.months.length;ri++){
    inputCols.forEach(col=>{
      sc.months[ri][col.key]=m1[col.key];
    });
    calcRow(sc.months[ri],storeData.master,sc.settings,storeData.staffTypes);
  }
  renderDataTable(sc,scIdx);
  saveStoreDebounced();
}

// Excel-like arrow key navigation in data table
document.addEventListener('keydown',function(e){
  const el=document.activeElement;
  if(!el||!el.closest||!el.closest('.dt'))return;
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Enter'].includes(e.key))return;
  const td=el.closest('td');if(!td)return;
  const tr=td.closest('tr');if(!tr)return;
  const tbody=tr.closest('tbody');if(!tbody)return;
  const rows=Array.from(tbody.querySelectorAll('tr:not(.yr)'));
  const ri=rows.indexOf(tr);
  const cells=Array.from(tr.querySelectorAll('td'));
  const ci=cells.indexOf(td);
  let targetRow=ri,targetCol=ci;
  if(e.key==='ArrowUp'||e.key==='Enter'&&e.shiftKey){targetRow=ri-1;e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='Enter'&&!e.shiftKey){targetRow=ri+1;e.preventDefault();}
  else if(e.key==='ArrowLeft'){
    if(el.selectionStart===0||el.type==='number'){targetCol=ci-1;e.preventDefault();}
    else return;
  }
  else if(e.key==='ArrowRight'){
    if(el.selectionStart===el.value.length||el.type==='number'){targetCol=ci+1;e.preventDefault();}
    else return;
  }
  else if(e.key==='Tab'){
    targetCol=e.shiftKey?ci-1:ci+1;
    e.preventDefault();
  }
  // Find next input in target cell
  function focusInput(r,c){
    if(r<0||r>=rows.length)return false;
    const tds=rows[r].querySelectorAll('td');
    // Search from target col in direction
    for(let i=c;i>=0&&i<tds.length;i+=(c>=ci?1:-1)){
      const inp=tds[i].querySelector('input,select');
      if(inp){inp.focus();inp.select&&inp.select();return true;}
    }
    return false;
  }
  if(!focusInput(targetRow,targetCol)){
    // If same row, try wrapping
    if(targetRow!==ri)focusInput(targetRow,ci);
  }
});

const EQ_STORE_OPTIONS=['both','k','c'];
// 業者担当者の連絡先(氏名・携帯・メール)はFirestore ss_vendor_contacts コレクションにのみ保存する。
// このファイル(公開HTML)には実値を一切埋め込まない（2026-07-28 セキュリティ対応・INC対応）。
let eqContactsMap={};
function genEqId(){return 'it_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const DEFAULT_EQ_DATA={categories:[

  {name:'内装',items:[

  ]},

  ]},
]};

let eqData=null,eqSaveTimer=null;

async function loadEquipmentData(){
  try{const doc=await db.collection('equipment').doc(EQ_DOC_ID).get();eqData=doc.exists?doc.data():JSON.parse(JSON.stringify(DEFAULT_EQ_DATA));}
  catch(e){eqData=JSON.parse(JSON.stringify(DEFAULT_EQ_DATA));}
  try{
    const cdoc=await db.collection('ss_vendor_contacts').doc(EQ_DOC_ID).get();
    eqContactsMap=cdoc.exists?(cdoc.data().contacts||{}):{};
  }catch(e){eqContactsMap={};}
  // 旧データに平文contactが残っていた場合はここでss_vendor_contactsへ回収し、equipmentドキュメントからは削除する（自己修復マイグレーション）。
  let idsAdded=false,legacyMigrated=false;
  eqData.categories.forEach(cat=>{cat.items.forEach(item=>{
    if(!item.id){item.id=genEqId();idsAdded=true;}
    if(item.contact!==undefined){
      if(item.contact&&item.contact!=='-'&&!eqContactsMap[item.id]){eqContactsMap[item.id]=item.contact;legacyMigrated=true;}
      delete item.contact;idsAdded=true;
    }
  });});
  if(canEdit){
    if(idsAdded) saveEquipmentDebounced();
    if(legacyMigrated) saveEqContactsDebounced();
  }
}
function saveEquipmentDebounced(){
  if(!canEdit)return;clearTimeout(eqSaveTimer);
  eqSaveTimer=setTimeout(async()=>{try{await db.collection('equipment').doc(EQ_DOC_ID).set({...eqData,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentUser.email});}catch(e){console.error(e);}},1500);
}
let eqContactsSaveTimer=null;
function saveEqContactsDebounced(){
  if(!canEdit)return;clearTimeout(eqContactsSaveTimer);
  eqContactsSaveTimer=setTimeout(async()=>{try{await db.collection('ss_vendor_contacts').doc(EQ_DOC_ID).set({contacts:eqContactsMap,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentUser.email});}catch(e){console.error(e);}},1500);
}
function eqContactCell(item){
  if(!currentUser) return 'ログインで表示';
  return eqContactsMap[item.id]||'';
}
function eqUpd(ci,ii,field,val){
  if(field==='contact'){
    const id=eqData.categories[ci].items[ii].id;
    eqContactsMap[id]=val;
    saveEqContactsDebounced();
    return;
  }
  eqData.categories[ci].items[ii][field]=val;saveEquipmentDebounced();
}
function eqAddItem(ci){eqData.categories[ci].items.push({id:genEqId(),name:'',maker:'',store:'both',status:'tbd',note:''});renderEquipment(document.getElementById('main-content'));saveEquipmentDebounced();}
function eqDelItem(ci,ii){const item=eqData.categories[ci].items[ii];if(item.name&&!confirm(`「${item.name}」を削除しますか？`))return;if(item.id&&eqContactsMap[item.id]!==undefined){delete eqContactsMap[item.id];saveEqContactsDebounced();}eqData.categories[ci].items.splice(ii,1);renderEquipment(document.getElementById('main-content'));saveEquipmentDebounced();}
function eqAddCat(){const name=prompt('カテゴリ名を入力してください');if(!name)return;eqData.categories.push({name,items:[]});renderEquipment(document.getElementById('main-content'));saveEquipmentDebounced();}
function eqDelCat(ci){if(!confirm(`カテゴリ「${eqData.categories[ci].name}」を削除しますか？\n含まれる品目もすべて削除されます。`))return;eqData.categories.splice(ci,1);renderEquipment(document.getElementById('main-content'));saveEquipmentDebounced();}

async function renderEquipment(el){
  if(!eqData) await loadEquipmentData();

    ${canEdit?`<th style="${cellS};background:#1a2744;width:28px"></th>`:''}
  </tr></thead><tbody>`;
  eqData.categories.forEach((cat,ci)=>{
    h+=`<tr><td colspan="${cols}" style="${cellS};background:#263548;font-weight:700;font-size:0.82rem;color:var(--accent-blue);padding:5px 8px">`;
    h+=esc(cat.name)+` <span style="color:var(--text-muted);font-weight:400;font-size:0.75rem">(${cat.items.length})</span>`;
    if(canEdit){
      h+=` <button onclick="eqAddItem(${ci})" style="background:none;border:none;color:var(--accent-blue);cursor:pointer;font-size:0.75rem;padding:0 4px">+行</button>`;
      h+=` <button onclick="eqDelCat(${ci})" style="background:none;border:none;color:var(--accent-red);cursor:pointer;font-size:0.75rem;padding:0 4px">&times;削除</button>`;
    }
    h+=`</td></tr>`;
    cat.items.forEach((item,ii)=>{
      const rowBg=ii%2===0?'transparent':'rgba(255,255,255,0.02)';
      if(canEdit){
        h+=`<tr style="background:${rowBg}">`;
        h+=`<td style="${cellS}"><input style="${inpS}" value="${esc(item.name)}" onchange="eqUpd(${ci},${ii},'name',this.value)"></td>`;
        h+=`<td style="${cellS}"><input style="${inpS}" value="${esc(item.maker)}" onchange="eqUpd(${ci},${ii},'maker',this.value)"></td>`;
        h+=`<td style="${cellS}"><input style="${inpS}" value="${esc(eqContactCell(item))}" onchange="eqUpd(${ci},${ii},'contact',this.value)"></td>`;
        h+=`<td style="${cellS};text-align:center"><select style="${inpS};cursor:pointer;text-align:center" onchange="eqUpd(${ci},${ii},'store',this.value)">`;
        EQ_STORE_OPTIONS.forEach(s=>{h+=`<option value="${s}"${item.store===s?' selected':''}>${EQ_STORE_LABELS[s]}</option>`;});
        h+=`</select></td>`;
        h+=`<td style="${cellS};text-align:center"><select style="${inpS};cursor:pointer;text-align:center" onchange="eqUpd(${ci},${ii},'status',this.value)">`;
        EQ_STATUS_OPTIONS.forEach(s=>{h+=`<option value="${s}"${item.status===s?' selected':''}>${EQ_STATUS_LABELS[s]}</option>`;});
        h+=`</select></td>`;
        h+=`<td style="${cellS}"><input style="${inpS}" value="${esc(item.note)}" onchange="eqUpd(${ci},${ii},'note',this.value)"></td>`;
        h+=`<td style="${cellS};text-align:center"><button onclick="eqDelItem(${ci},${ii})" style="background:none;border:none;color:var(--accent-red);cursor:pointer;font-size:0.8rem">&times;</button></td>`;

      }else{
        h+=`<tr style="background:${rowBg}">`;
        h+=`<td style="${cellS};font-weight:500">${esc(item.name)}</td>`;
        h+=`<td style="${cellS}">${esc(item.maker)}</td>`;
        h+=`<td style="${cellS};color:var(--text-muted)">${esc(eqContactCell(item))}</td>`;
        h+=`<td style="${cellS};text-align:center">${EQ_STORE_LABELS[item.store||'both']}</td>`;
        h+=`<td style="${cellS};text-align:center">${EQ_STATUS_LABELS[item.status||'tbd']}</td>`;
        h+=`<td style="${cellS};color:var(--text-muted)">${esc(item.note)}</td>`;
        h+=`</tr>`;
      }
    });
  });
  h+=`</tbody></table></div>`;
  if(canEdit) h+=`<button onclick="eqAddCat()" style="margin-top:8px;padding:4px 12px;background:transparent;border:1px solid var(--border);font-size:0.8rem;cursor:pointer;color:var(--text-muted)">+ カテゴリ追加</button>`;
  el.innerHTML=h;
}

// ──────────────────────────────────────────────
// 曜日別営業時間 ヘルパー
// ──────────────────────────────────────────────
const WEEK_DAYS=['月','火','水','木','金','土','日'];
const WEEK_KEYS=['mon','tue','wed','thu','fri','sat','sun'];

/** 30分刻みの時刻選択肢を生成（"09:00"〜"22:00" + "休み"） */
function buildTimeOptions(selected){
  let html='<option value="closed"'+(selected==='closed'?' selected':'')+'>(休み)</option>';
  for(let h=8;h<=22;h++){
    for(let m=0;m<60;m+=30){
      const val=(h<10?'0':'')+h+':'+(m===0?'00':'30');
      html+=`<option value="${val}"${selected===val?' selected':''}>${val}</option>`;
    }
  }
  return html;
}

/** デフォルトの曜日別設定を返す（既存 openTime/closeTime から生成） */
function defaultWeeklyHours(master){
  const open=master.openTime||'09:00';
  const close=master.closeTime||'18:00';
  // 既存データを09:00形式に正規化
  const normalizeT=t=>t&&t.length===4?'0'+t:t;
  const o=normalizeT(open)||'09:00';
  const c=normalizeT(close)||'18:00';
  return {
    mon:{open:o,close:c,breakMin:60},
    tue:{open:o,close:c,breakMin:60},
    wed:{open:o,close:c,breakMin:60},
    thu:{open:o,close:c,breakMin:60},
    fri:{open:o,close:c,breakMin:60},
    sat:{open:'closed',close:c,breakMin:0},
    sun:{open:'closed',close:c,breakMin:0},
  };
}

/** master.weeklyHours から表示用サマリー文字列を生成 */
function weeklyHoursSummary(master){
  const wh=master.weeklyHours;
  if(!wh)return (master.openTime||'9:00')+'〜'+(master.closeTime||'18:00');
  const parts=WEEK_KEYS.map((k,i)=>{
    const d=wh[k];
    if(!d||d.open==='closed')return WEEK_DAYS[i]+':休';
    return WEEK_DAYS[i]+': '+d.open+'〜'+d.close+(d.breakMin?'(休憩'+d.breakMin+'分)':'');
  });
  return parts.join(' / ');
}

/** 設定フォームの曜日別営業時間行を生成 */
function buildWeeklyHoursRows(master){
  const wh=master.weeklyHours||defaultWeeklyHours(master);
  return WEEK_KEYS.map((k,i)=>{
    const d=wh[k]||{open:'09:00',close:'18:00',breakMin:60};
    const isClosed=d.open==='closed';
    const disAttr=isClosed?' disabled style="opacity:0.35;pointer-events:none"':'';
    return `<tr id="whr-${k}" style="${isClosed?'background:var(--bg-secondary)':''}">
      <td style="padding:8px 10px;border:1px solid var(--border);font-weight:600;white-space:nowrap">${WEEK_DAYS[i]}曜</td>
      <td style="padding:6px 8px;border:1px solid var(--border)">
        <select onchange="onWeeklyHoursOpen('${k}',this.value)" style="padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.82rem;width:100%;min-width:90px">
          ${buildTimeOptions(d.open)}
        </select>
      </td>
      <td style="padding:6px 8px;border:1px solid var(--border)">
        <select id="wh-close-${k}"${disAttr} onchange="onWeeklyHoursField('${k}','close',this.value)" style="padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.82rem;width:100%;min-width:90px">
          ${buildTimeOptions(isClosed?d.close||'18:00':d.close)}
        </select>
      </td>
      <td style="padding:6px 8px;border:1px solid var(--border)">
        <input id="wh-break-${k}" type="number" min="0" max="240" step="15" value="${d.breakMin||0}"${disAttr} onchange="onWeeklyHoursField('${k}','breakMin',parseInt(this.value)||0)" style="padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:0.82rem;width:80px"> 分
      </td>
    </tr>`;
  }).join('');
}

/** 開局時刻変更（"closed" のときは行をグレーアウト） */
function onWeeklyHoursOpen(dayKey,val){
  if(!storeData.master.weeklyHours)storeData.master.weeklyHours=defaultWeeklyHours(storeData.master);
  storeData.master.weeklyHours[dayKey].open=val;
  const isClosed=val==='closed';
  const row=document.getElementById('whr-'+dayKey);
  if(row){row.style.background=isClosed?'var(--bg-secondary)':'';}
  ['close','break'].forEach(f=>{
    const el=document.getElementById('wh-'+f+'-'+dayKey);
    if(!el)return;
    if(isClosed){el.disabled=true;el.style.opacity='0.35';el.style.pointerEvents='none';}
    else{el.disabled=false;el.style.opacity='';el.style.pointerEvents='';}
  });
  saveStoreDebounced();
}

/** 閉局時刻・休憩時間変更 */
function onWeeklyHoursField(dayKey,field,val){
  if(!storeData.master.weeklyHours)storeData.master.weeklyHours=defaultWeeklyHours(storeData.master);
  storeData.master.weeklyHours[dayKey][field]=val;
  saveStoreDebounced();
}

function copyScenarioText(idx){
  const sc=storeData.scenarios[idx];if(!sc)return;
  const m=storeData.master,s=sc.settings,st=storeData.staffTypes||[];
  const ti=getTotalInv(),inv=storeData.investment;
  const an=getAnnual(sc.months),pb=getPayback(sc.months,ti),cum=sc.months.reduce((a,r)=>a+r.operatingProfit,0);
  const mix=calcDeptMix(m.deptMix);
  const opDays=m.operatingDays||25;
  const marginRate=m.drugMarginRate!=null?m.drugMarginRate:0.05;

  let t=`【事業計画】${storeData.name} - ${sc.name}シナリオ\n`;
  t+=`作成日: ${new Date().toLocaleDateString('ja-JP')}\n\n`;

  t+=`■ 店舗情報\n`;
  t+=`門前科目: ${(m.deptMix||[]).map(d=>d.dept+'('+d.ratio+'%)').join(' / ')||'未設定'}\n`;
  t+=`営業: 月${opDays}日 / ${weeklyHoursSummary(m)}\n`;
  const techPrice=mix.totalRatio===100?mix.techFeePerRx:m.techFeePerRx;
  const drugPrice=mix.totalRatio===100?mix.drugCostPerRx:m.drugCostPerRx;
  t+=`技術料: ${fmt(techPrice)}円/枚 / 薬剤料: ${fmt(drugPrice)}円/枚\n`;
  t+=`薬価差益率: ${(marginRate*100).toFixed(1)}% / 家賃: ${fmt(m.rent||s.rent)}円/月\n\n`;

  t+=`■ 初期投資: ${fmtOku(ti)}\n`;
  t+=`設備投資: ${fmtMY(inv.equipment.reduce((a,e)=>a+e.value,0))}\n`;
  inv.equipment.forEach(e=>{if(e.value>0)t+=`  ${e.label}: ${fmt(e.value)}円\n`;});
  t+=`運転資金: ${fmtMY(inv.working.reduce((a,e)=>a+e.value,0))}\n`;
  inv.working.forEach(e=>{if(e.value>0)t+=`  ${e.label}: ${fmt(e.value)}円\n`;});
  t+=`\n`;

  t+=`■ 人材マスタ\n`;
  st.forEach(s=>t+=`${s.name}: ${fmt(s.monthlySalary)}円/月 (年収${fmt(s.monthlySalary*12)}円)\n`);
  t+=`\n`;

  const confirmed=storeData.confirmedStaff||[];
  if(confirmed.length){
    t+=`\u25a0 \u5185\u5b9a\u8005\u60c5\u5831\n`;
    confirmed.forEach(p=>t+=`${p.name}: ${p.store||'-'} / ${p.role||'-'} / ${p.status||'-'} / \u5165\u793e\u4e88\u5b9a ${p.plannedStart||'-'} ${p.note?'- '+p.note:''}\n`);
    t+=`\n`;
  }

  t+=`\u25a0 KPI\n`;
  t+=`投資回収: ${pb?Math.ceil(pb/12*10)/10+'年 ('+pb+'ヶ月)':'4年超'}\n`;
  t+=`4年累計利益: ${fmtOku(cum)} (ROI ${ti>0?(cum/ti*100).toFixed(0):0}%)\n\n`;

  t+=`■ 年間損益\n`;
  t+=`年度\t売上高\t売上総利益\t営業利益\n`;
  an.forEach(y=>t+=`${y.year}年目\t${fmtOku(y.revenue)}\t${fmtOku(y.grossProfit)}\t${fmtOku(y.operatingProfit)}\n`);
  t+=`累計\t${fmtOku(an.reduce((a,y)=>a+y.revenue,0))}\t${fmtOku(an.reduce((a,y)=>a+y.grossProfit,0))}\t${fmtOku(cum)}\n\n`;

  t+=`■ 月次データ（1年目）\n`;
  t+=`月\t外来枚数\t在宅\t売上高\t粗利\t人件費\t営業利益\n`;
  sc.months.filter(r=>r.year===1).forEach(r=>{
    const rx=r.rxTotal||r.rxCount||0;
    t+=`${r.month}\t${fmt(rx)}\t${r.homecareCount||0}\t${fmt(r.revenue)}\t${fmt(r.grossProfit)}\t${fmt(r.staffCost)}\t${fmt(r.operatingProfit)}\n`;
  });

  // コンプライアンス
  const rx1=sc.months[0].rxTotal||sc.months[0].rxCount||0;
  const daily=rx1>0?Math.ceil(rx1/opDays):0;
  let phCount=0;st.forEach((s,i)=>{if(s.name.includes('薬剤師')||s.name.includes('マネージャー'))phCount+=(sc.months[0]['staff_'+i]||0);});
  t+=`\n■ コンプライアンス\n`;
  t+=`1日あたり: ${daily}枚 / 薬剤師${phCount}名 / 1人あたり${phCount>0?Math.ceil(daily/phCount):0}枚 (上限40枚)\n`;

  navigator.clipboard.writeText(t).then(()=>alert('テキストをクリップボードにコピーしました。NotebookLMのソースやチャットに貼り付けてください。')).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    alert('テキストをコピーしました。');
  });
}

  h+=`</tbody></table>
  <p style="font-size:9pt;color:#666;margin-top:4px">※ 実際の配置人数は月次計画表で月ごとに設定</p>`;
  // \u5185\u5b9a\u8005\u60c5\u5831\u306f\u5370\u5237\u5bfe\u8c61\u304b\u3089\u9664\u5916\uff082026-07-08 \u5c71\u5185\u3055\u3093\u6307\u793a\u30fb\u500b\u4eba\u60c5\u5831\u306e\u305f\u3081\uff09

  // 年間P/L
  h+=`<h2>5. 年間損益計画</h2><table><thead><tr><th>年度</th><th>売上高</th><th>売上総利益</th><th>営業利益</th></tr></thead><tbody>`;
  an.forEach(y=>h+=`<tr><td>${y.year}年目</td><td>${fmtOku(y.revenue)}</td><td>${fmtOku(y.grossProfit)}</td><td class="${y.operatingProfit>=0?'pos':'neg'}">${fmtOku(y.operatingProfit)}</td></tr>`);
  h+=`<tr style="font-weight:700;background:#e8f0fe"><td>4年累計</td><td>${fmtOku(an.reduce((a,y)=>a+y.revenue,0))}</td><td>${fmtOku(an.reduce((a,y)=>a+y.grossProfit,0))}</td><td class="${cum>=0?'pos':'neg'}">${fmtOku(cum)}</td></tr>`;
  h+=`</tbody></table>`;

  // 月次P/L（1年目のみ詳細）
  h+=`<h2>6. 月次損益計画（1年目）</h2><table><thead><tr><th>月</th><th>外来枚数</th><th>在宅</th><th>売上高</th><th>仕入原価</th><th>粗利</th><th>人件費</th><th>家賃</th><th>他経費</th><th>減価償却</th><th>営業利益</th></tr></thead><tbody>`;
  sc.months.filter(r=>r.year===1).forEach(r=>{
    const rx=r.rxTotal||r.rxCount||0;
    h+=`<tr><td>${r.month}</td><td>${fmt(rx)}</td><td>${r.homecareCount||0}</td><td>${fmt(r.revenue)}</td><td>${fmt(r.cogs)}</td><td>${fmt(r.grossProfit)}</td><td>${fmt(r.staffCost)}</td><td>${fmt(r.rent)}</td><td>${fmt(r.otherCost)}</td><td>${fmt(r.depreciation||0)}</td><td class="${r.operatingProfit>=0?'pos':'neg'}">${fmt(r.operatingProfit)}</td></tr>`;
  });
  const y1=an[0];
  h+=`<tr style="font-weight:700;background:#e8f0fe"><td>合計</td><td></td><td></td><td>${fmtOku(y1.revenue)}</td><td></td><td>${fmtOku(y1.grossProfit)}</td><td></td><td></td><td></td><td>${fmtOku(sc.months.filter(r=>r.year===1).reduce((a,r)=>a+(r.depreciation||0),0))}</td><td class="${y1.operatingProfit>=0?'pos':'neg'}">${fmtOku(y1.operatingProfit)}</td></tr>`;
  h+=`</tbody></table>`;

  // コンプライアンス
  const rx1=sc.months[0].rxTotal||sc.months[0].rxCount||0;
  const daily=rx1>0?Math.ceil(rx1/opDays):0;
  let phCount=0;st.forEach((t,i)=>{if(t.name.includes('薬剤師')||t.name.includes('マネージャー'))phCount+=(sc.months[0]['staff_'+i]||0);});
  const reqPh=daily>0?Math.ceil(daily/40):0;
  h+=`<h2>7. コンプライアンス確認</h2>
  <table><tbody>
    <tr><td class="label">1日あたり処方箋数</td><td>${daily}枚/日（月${fmt(rx1)}枚 ÷ ${opDays}日）</td></tr>
    <tr><td class="label">薬剤師1人あたり上限</td><td>40枚/日</td></tr>
    <tr><td class="label">必要薬剤師数</td><td>${reqPh}名</td></tr>
    <tr><td class="label">配置薬剤師数（1ヶ月目）</td><td>${phCount}名 ${phCount<reqPh?'<span class="warn">（'+( reqPh-phCount)+'名不足）</span>':'（充足）'}</td></tr>
  </tbody></table>`;

  h+=`<div class="footer">ワイズ株式会社 収益シミュレーション ダッシュボードより出力<br>${new Date().toLocaleString('ja-JP')}</div>`;
  h+=`</body></html>`;

  w.document.write(h);
  w.document.close();
  setTimeout(()=>w.print(),500);
}

async function loadUsers(){
  const snap=await db.collection('store_sim_users').get();const tbody=document.querySelector('#user-table tbody');if(!tbody)return;tbody.innerHTML='';
  snap.forEach(doc=>{const d=doc.data();const tr=document.createElement('tr');
    tr.innerHTML=`<td>${d.email}</td><td>${d.name||'-'}</td><td><select onchange="updateUserRole('${d.email}',this.value)" style="background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);padding:4px;border-radius:4px"><option value="viewer" ${d.role==='viewer'?'selected':''}>viewer</option><option value="editor" ${d.role==='editor'?'selected':''}>editor</option><option value="admin" ${d.role==='admin'?'selected':''}>admin</option></select></td><td>${d.email!==currentUser.email?`<button class="btn-sm" onclick="removeUser('${d.email}')">削除</button>`:''}</td>`;
    tbody.appendChild(tr);});
}
async function addUser(){const e=document.getElementById('add-user-email').value.trim(),r=document.getElementById('add-user-role').value;if(!e)return;await db.collection('store_sim_users').doc(e).set({email:e,name:'',role:r,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});document.getElementById('add-user-email').value='';loadUsers();}
async function updateUserRole(e,r){await db.collection('store_sim_users').doc(e).update({role:r})}
function removeUser(email){showModal('ユーザー削除',`<p>${email} を削除しますか？</p>`,async()=>{await db.collection('store_sim_users').doc(email).delete();loadUsers();closeModal()});}
</script>
</body>
